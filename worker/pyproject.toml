[project]
name = "sermon-worker"
version = "0.0.0"
description = "sermon.guide ingestion pipeline + Celery workers."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pymilvus>=2.6,<3",
  "python-magic>=0.4.27,<0.5",
  "ebooklib>=0.20,<0.21",
  "pypandoc>=1.17,<2",
  "pymupdf4llm>=1.27,<2",
]

[dependency-groups]
dev = [
  "numpy>=2.4.4",
  "pyright",
  "pytest",
  "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "TRY", "ASYNC", "S", "ARG", "ERA", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "use datetime.now(tz=UTC)"
"pickle".msg = "use json or msgpack — pickle is unsafe across versions"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
# Worker is intentionally not packaged (see `[tool.uv] package = false`),
# so test imports like `from extractors import …` need cwd on sys.path.
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["extractors", "scripts", "tests"]
venvPath = "."
venv = ".venv"
