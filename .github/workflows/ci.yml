# CI — unit gates run keyless and infra-free; the compose-backed job below is
# where the infra-gated suites must actually RUN (Phase 17). Post-Phase-16b
# (ADR 0006) there are no local models and no HF cache to provision:
# embeddings are remote DeepInfra calls, so the only resources CI boots are
# the docker-compose services (Postgres / Redis / MinIO / Milvus + etcd).
#
# Job map:
#   filter              package-existence outputs + changed-path gate for the
#                       compose-backed jobs (docs-only PRs skip the infra boot)
#   worker/api/web      lint + typecheck + unit tests — no infra, no secrets;
#                       infra-gated tests skip here BY DESIGN. Never "fix" a
#                       skip by wiring infra into these jobs; that is what
#                       tenant-isolation is for.
#   tenant-isolation    boots infra/docker-compose.yml and runs the Phase 3
#                       isolation + Phase 31 storage + Phase 8 dedup suites
#                       for real — keyless, zero spend (synthetic vectors; the
#                       storage paths avoid remote embeddings by design). A
#                       no-skip guard FAILS the job on any SKIPPED test, so a
#                       vacuous green is impossible. Operators: mark this job
#                       REQUIRED in branch protection.
#   retrieval-golden    Phase 11 regression gate, keyless flavor. Skip-passes
#                       until the DEEPINFRA_API_KEY secret + Phase 23 corpus
#                       exist — but the golden-loud-skip-guard step makes the
#                       vacuous green LOUD (::warning + job summary).
#   retrieval-golden-live  Activates AUTOMATICALLY once the operator runs
#                       `gh secret set DEEPINFRA_API_KEY` (no workflow edit
#                       needed; the filter job probes secret presence). Boots
#                       compose and runs the keyed suites live — cents/run.
#                       Fork PRs never see secrets, so it skips there.
#   phases-row-flipped  PHASES.md bookkeeping gate for phase-N/* PRs

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Detect packages + changed paths
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.detect.outputs.worker }}
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
      retrieval_golden: ${{ steps.detect.outputs.retrieval_golden }}
      infra_stack: ${{ steps.paths.outputs.infra_stack }}
      deepinfra_key: ${{ steps.secret_probe.outputs.deepinfra_key }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the changed-path gate can diff against the PR base.
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          {
            echo "worker=$([ -f worker/pyproject.toml ] && echo true || echo false)"
            echo "api=$([ -f api/pyproject.toml ] && echo true || echo false)"
            echo "web=$([ -f web/package.json ] && echo true || echo false)"
            echo "retrieval_golden=$([ -f worker/tests/golden/queries.jsonl ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      # Changed-path gate for the compose-backed jobs: docs-only PRs must not
      # pay the multi-minute infra boot. Pushes to main always run the full
      # gate. Detection failures fail OPEN (run the gate) — this guards a
      # security check, so "accidentally ran" beats "accidentally skipped".
      - id: paths
        name: Changed-path gate for infra jobs
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "push event — infra gates always run on main"
            echo "infra_stack=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${GITHUB_BASE_REF}"
          if ! changed="$(git diff --name-only "${base}...HEAD")"; then
            echo "::warning title=Changed-path gate failed open::git diff against ${base} failed; running infra gates anyway."
            echo "infra_stack=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files vs ${base}:"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(worker/|api/|infra/|Makefile$|\.github/workflows/ci\.yml$)'; then
            echo "infra_stack=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra_stack=false" >> "$GITHUB_OUTPUT"
          fi
      # The secrets context is not readable in job-level `if:`, so surface
      # key presence as an output for retrieval-golden-live to gate on.
      # Operator-owned: setting the repo secret is the ONLY step needed to
      # activate the live job. Fork PRs get no secrets → 'false' → skip.
      - id: secret_probe
        name: Probe DEEPINFRA_API_KEY presence
        env:
          HAS_DEEPINFRA_KEY: ${{ secrets.DEEPINFRA_API_KEY != '' }}
        run: echo "deepinfra_key=${HAS_DEEPINFRA_KEY}" >> "$GITHUB_OUTPUT"

  worker:
    name: worker (lint + typecheck + test)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.worker == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: cd worker && uv sync --all-extras --dev
      - name: Lint
        run: cd worker && uv run ruff check .
      - name: Format check
        run: cd worker && uv run ruff format --check .
      - name: Typecheck
        run: cd worker && uv run pyright
      - name: Test
        run: cd worker && uv run pytest

  api:
    name: api (lint + typecheck + test)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: cd api && uv sync --all-extras --dev
      - name: Lint
        run: cd api && uv run ruff check .
      - name: Format check
        run: cd api && uv run ruff format --check .
      - name: Typecheck
        run: cd api && uv run pyright
      - name: Test
        run: cd api && uv run pytest

  web:
    name: web (typecheck + lint + test)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: cd web && pnpm install --frozen-lockfile
      - name: Typecheck
        run: cd web && pnpm tsc --noEmit
      - name: Lint
        run: cd web && pnpm biome check
      - name: Test
        run: cd web && pnpm vitest run

  # Phase 17: the compose-backed gate. Everything here is keyless and free —
  # isolation vectors are synthetic (Phase 3), the Phase 31 storage tests
  # avoid remote embeddings by construction, and dedup needs only the WordNet
  # download. Runs in parallel with `worker` (compose boot overlaps lint).
  # Cold runs pull ~3-5 GB of images (Milvus dominates); expect ~5-8 min.
  tenant-isolation:
    name: tenant-isolation (infra gates)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.worker == 'true' && needs.filter.outputs.infra_stack == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # `make up` self-creates infra/.env from infra/.env.example (root
      # Makefile `env` target) and blocks until every compose healthcheck
      # passes (`docker compose up -d --wait`).
      - name: Boot infra stack (docker compose --wait)
        run: make up
      - name: Install worker deps
        run: cd worker && uv sync --all-extras --dev
      # Fresh Postgres has zero tables, and migration 0003 seeds the `meta`
      # embedding-model row. The make target sources infra/.env itself —
      # required, because db/settings.py defaults to the dev box's remapped
      # port (54322) while compose listens on 5432 (see worker/AGENTS.md).
      - name: Run migrations
        run: make -C worker migrate-up
      - name: Bootstrap Milvus collection
        run: make -C worker bootstrap-milvus
      - name: Install WordNet corpus (dedup + storage dup-hit gates)
        run: cd worker && uv run python -c "import nltk; nltk.download('wordnet')"
      # Exact local enforcement command (CLAUDE.md / ARCHITECTURE.md §7.1).
      # Milvus env defaults (localhost:19530) match compose; no sourcing needed.
      - name: Tenant-isolation suite (Phase 3 hard gate)
        shell: bash
        env:
          COLUMNS: "200"
        run: |
          set -euo pipefail
          make -C worker test-isolation 2>&1 | tee /tmp/pytest-isolation.log
      # Storage layers 2-3 + the whole dedup module run for real with the
      # stack up. infra/.env MUST be sourced here (Postgres port trap above).
      - name: Storage + dedup suites (Phase 31 / Phase 8 gates)
        shell: bash
        env:
          COLUMNS: "200"
        run: |
          set -euo pipefail
          set -a && . infra/.env && set +a
          cd worker
          uv run pytest tests/test_storage.py tests/test_dedup.py -v -rs 2>&1 | tee /tmp/pytest-storage-dedup.log
      # The reason this job exists: before Phase 17 these suites skip-passed
      # in CI and tenant isolation was only ever enforced on the dev box.
      # Any SKIPPED here means broken wiring, and the job goes RED — the
      # mutation-proof contract from docs/PHASES.md Phase 17.
      - name: No-skip guard (gates must run — red, not skipped)
        shell: bash
        run: |
          set -euo pipefail
          if grep -iE "skipped" /tmp/pytest-isolation.log /tmp/pytest-storage-dedup.log; then
            echo "::error title=Vacuous green blocked::Infra-gated tests reported SKIPPED with the compose stack up. The matching lines above name the broken wiring — fix it; do not exempt the test."
            exit 1
          fi
          echo "OK: every infra-gated test executed for real."
      - name: Compose logs (debug)
        if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env logs --tail=200
      - name: Teardown infra stack
        if: always()
        shell: bash
        run: |
          if [ -f infra/.env ]; then make down; else echo "stack never booted"; fi

  # Phase 11 regression gate, keyless flavor. The dev corpus is copyrighted
  # (gitignored) and this job gets no DEEPINFRA_API_KEY, so today every row
  # skip-passes — the guard step below makes that LOUD so the green is never
  # silent. Stays cheap on purpose: no compose boot, no spend.
  retrieval-golden:
    name: retrieval-golden (regression gate)
    runs-on: ubuntu-latest
    needs: [filter, worker]
    if: needs.filter.outputs.retrieval_golden == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: cd worker && uv sync --all-extras --dev
      - name: Run golden retrieval tests
        shell: bash
        env:
          COLUMNS: "200"
        run: |
          set -euo pipefail
          cd worker
          uv run pytest tests/test_retrieval_golden.py -v -rs 2>&1 | tee /tmp/pytest-golden.log
      # Loud-skip posture (Phase 17, prompt option (b) upgraded): green but
      # NEVER silent. Names the exact activation path in the annotation and
      # the job summary.
      - name: golden-loud-skip-guard
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -iE "skipped" /tmp/pytest-golden.log; then
            echo "Golden suite executed for real — no skips."
            exit 0
          fi
          title="retrieval-golden is skip-passing (green but vacuous)"
          msg="Activation: (1) operator runs: gh secret set DEEPINFRA_API_KEY — the retrieval-golden-live job then turns on automatically; (2) Phase 23 commits a public-domain CI corpus + golden rows, un-skipping the query tests."
          echo "::warning title=${title}::${msg}"
          {
            echo "## :warning: ${title}"
            echo ""
            echo "${msg}"
            echo ""
            echo '```'
            grep -E "^SKIPPED|[0-9]+ skipped" /tmp/pytest-golden.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Keyed flavor — exists from this commit on, but runs only when the filter
  # job sees the DEEPINFRA_API_KEY repo secret (operator-owned; never wired
  # here). Spend per run: cents (ingest e2e + embedding weight-parity trio;
  # the golden corpus adds ~$0.006/book once Phase 23 lands — every CI run is
  # a COLD ingest because the compose stack is ephemeral). Also path-gated:
  # docs-only PRs don't spend.
  retrieval-golden-live:
    name: retrieval-golden-live (DeepInfra-keyed)
    runs-on: ubuntu-latest
    needs: [filter, worker]
    if: >-
      needs.filter.outputs.retrieval_golden == 'true' &&
      needs.filter.outputs.deepinfra_key == 'true' &&
      needs.filter.outputs.infra_stack == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Boot infra stack (docker compose --wait)
        run: make up
      - name: Install worker deps
        run: cd worker && uv sync --all-extras --dev
      - name: Run migrations
        run: make -C worker migrate-up
      - name: Bootstrap Milvus collection
        run: make -C worker bootstrap-milvus
      - name: Install WordNet corpus
        run: cd worker && uv run python -c "import nltk; nltk.download('wordnet')"
      # Golden rows skip on the missing corpus until Phase 23; the ingest
      # dedup-roundtrip e2e, the embedding weight-parity trio, and the
      # golden embedder-dim guard run live today.
      - name: Run keyed suites (golden + ingest e2e + embedding parity)
        shell: bash
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          COLUMNS: "200"
        run: |
          set -euo pipefail
          set -a && . infra/.env && set +a
          cd worker
          uv run pytest tests/test_retrieval_golden.py tests/test_ingest.py tests/test_embedding.py -v -rs 2>&1 | tee /tmp/pytest-golden-live.log
      # With compose up and the key wired, infra/key/WordNet skips are wiring
      # BUGS → fail. The only tolerated skip is the Phase 23 corpus gap —
      # warned, never silent. Classification uses the `-rs` summary lines
      # (full reasons); COLUMNS=200 keeps them untruncated.
      - name: Live-gate guard (only corpus-gap skips tolerated)
        shell: bash
        run: |
          set -euo pipefail
          skips="$(grep -E "^SKIPPED" /tmp/pytest-golden-live.log || true)"
          if [ -z "$skips" ]; then
            echo "Live golden gate fully executed — no skips."
            exit 0
          fi
          bad="$(printf '%s\n' "$skips" | grep -viE "corpus sample\(s\) missing" || true)"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            echo "::error title=retrieval-golden-live mis-wired::Non-corpus skips above must RUN in this job (compose is up, the key is wired). Fix the wiring; do not exempt the test."
            exit 1
          fi
          msg="Golden query rows still skip: no CI corpus yet. Phase 23 commits public-domain samples + golden rows to activate them."
          echo "::warning title=retrieval-golden-live awaiting Phase 23 corpus::${msg}"
          {
            echo "## :warning: retrieval-golden-live awaiting Phase 23 corpus"
            echo ""
            echo "${msg}"
            echo ""
            echo '```'
            printf '%s\n' "$skips"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compose logs (debug)
        if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env logs --tail=200
      - name: Teardown infra stack
        if: always()
        shell: bash
        run: |
          if [ -f infra/.env ]; then make down; else echo "stack never booted"; fi

  phases-row-flipped:
    name: phases-row-flipped (PHASES.md gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'phase-')
    steps:
      - uses: actions/checkout@v6
      - name: Verify PHASES.md row flipped for this phase
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_REF" =~ ^phase-([0-9]+)/ ]]; then
            echo "Branch '$HEAD_REF' is not phase-<N>/<slug>; skipping."
            exit 0
          fi
          n="${BASH_REMATCH[1]}"
          file="docs/PHASES.md"
          if [[ ! -f "$file" ]]; then
            echo "::error file=$file::$file not found"
            exit 1
          fi
          row="$(grep -E "^- \[[ x]\] Phase ${n}( |\$|—|-)" "$file" || true)"
          if [[ -z "$row" ]]; then
            echo "::error file=$file::No 'Phase ${n}' row found in $file. Expected '- [x] Phase ${n} — ...' on a phase-${n}/* branch."
            exit 1
          fi
          if [[ "$row" != "- [x] Phase ${n}"* ]]; then
            echo "::error file=$file::Branch '$HEAD_REF' closes Phase ${n}, but $file still has it unchecked."
            echo "Found: $row"
            echo ""
            echo "Fix: flip the row to '[x]' and append completion date, branch, and any deviations"
            echo "(see the header note in $file). Or rename the branch if this PR does not close Phase ${n}."
            exit 1
          fi
          echo "OK: $row"
