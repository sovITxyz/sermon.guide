[project]
name = "sermon-worker"
version = "0.0.0"
description = "sermon.guide ingestion pipeline + Celery workers."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pymilvus>=2.6,<3",
  "python-magic>=0.4.27,<0.5",
  "ebooklib>=0.20,<0.21",
  "pypandoc>=1.17,<2",
  "pymupdf4llm>=1.27,<2",
  "llama-index-core>=0.14,<0.15",
  "llama-index-embeddings-huggingface>=0.7,<0.8",
  "sentence-transformers>=3,<6",
  # Pulled in transitively by sentence-transformers but listed here so the
  # CPU-only source override in [tool.uv.sources] applies. The default PyPI
  # torch wheel bundles ~2GB of NVIDIA CUDA libraries we'd never use —
  # neither dev hardware (Intel iGPU) nor CI (GitHub Actions ubuntu-latest)
  # has a CUDA GPU, and Phase 6 explicitly defers GPU inference.
  "torch>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.13,<2",
  "asyncpg>=0.30,<0.31",
  "pydantic-settings>=2.6,<3",
  "datasketch>=1.10.0",
  "nltk>=3.9.4",
  "psycopg[binary]>=3,<4",
]

[dependency-groups]
dev = [
  "numpy>=2.4.4",
  "pyright",
  "pytest",
  "ruff",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "TRY", "ASYNC", "S", "ARG", "ERA", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "use datetime.now(tz=UTC)"
"pickle".msg = "use json or msgpack — pickle is unsafe across versions"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
# Worker is intentionally not packaged (see `[tool.uv] package = false`),
# so test imports like `from extractors import …` need cwd on sys.path.
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["extractors", "chunking.py", "db", "embedding.py", "ingest.py", "scripts", "tests"]
venvPath = "."
venv = ".venv"
