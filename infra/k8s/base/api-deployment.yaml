apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: api
    spec:
      # Phase 29 GHCR packages are private by default — without this pull
      # secret the pods ImagePullBackOff. Create it out-of-band (README).
      imagePullSecrets:
        - name: regcred
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Pinned to an immutable :sha-<commit> tag in the prod overlay.
          image: ghcr.io/sovitxyz/sermon-api:latest
          imagePullPolicy: IfNotPresent
          # Image default CMD is `uvicorn main:app --host 0.0.0.0 --port 8000
          # --no-proxy-headers` (the app trusts XFF itself via the settings
          # flag, never uvicorn). Do not override.
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: sermon-config
            - secretRef:
                name: sermon-secrets
          # GET /readyz is 200 only when Postgres+Milvus+Redis all answer
          # within budget — a rollout with a dead dependency is HELD here.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # GET /healthz is a dependency-free process-alive check — it never
          # flips on a transient Postgres blip, so liveness does not kill the
          # pod during a dependency outage.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Generous startup gate so slow boot does not trip liveness.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
