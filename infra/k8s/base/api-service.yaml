# ClusterIP only — NEVER an Ingress path browsers hit directly. Preserves
# the compose invariant: browsers only talk to the Next route handlers; web
# reaches the api over the cluster network at http://api:8000.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
