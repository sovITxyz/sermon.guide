name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Detect packages with source
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.detect.outputs.worker }}
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
      retrieval_golden: ${{ steps.detect.outputs.retrieval_golden }}
    steps:
      - uses: actions/checkout@v6
      - id: detect
        shell: bash
        run: |
          {
            echo "worker=$([ -f worker/pyproject.toml ] && echo true || echo false)"
            echo "api=$([ -f api/pyproject.toml ] && echo true || echo false)"
            echo "web=$([ -f web/package.json ] && echo true || echo false)"
            echo "retrieval_golden=$([ -f worker/tests/golden/queries.jsonl ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  worker:
    name: worker (lint + typecheck + test)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.worker == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: cd worker && uv sync --all-extras --dev
      - name: Lint
        run: cd worker && uv run ruff check .
      - name: Format check
        run: cd worker && uv run ruff format --check .
      - name: Typecheck
        run: cd worker && uv run pyright
      - name: Test
        run: cd worker && uv run pytest

  api:
    name: api (lint + typecheck + test)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: cd api && uv sync --all-extras --dev
      - name: Lint
        run: cd api && uv run ruff check .
      - name: Format check
        run: cd api && uv run ruff format --check .
      - name: Typecheck
        run: cd api && uv run pyright
      - name: Test
        run: cd api && uv run pytest

  web:
    name: web (typecheck + lint + test)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: cd web && pnpm install --frozen-lockfile
      - name: Typecheck
        run: cd web && pnpm tsc --noEmit
      - name: Lint
        run: cd web && pnpm biome check
      - name: Test
        run: cd web && pnpm vitest run

  retrieval-golden:
    name: retrieval-golden (regression gate)
    runs-on: ubuntu-latest
    needs: [filter, worker]
    if: needs.filter.outputs.retrieval_golden == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: cd worker && uv sync --all-extras --dev
      - name: Run golden retrieval tests
        run: cd worker && uv run pytest tests/test_retrieval_golden.py -v

  phases-row-flipped:
    name: phases-row-flipped (PHASES.md gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'phase-')
    steps:
      - uses: actions/checkout@v6
      - name: Verify PHASES.md row flipped for this phase
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_REF" =~ ^phase-([0-9]+)/ ]]; then
            echo "Branch '$HEAD_REF' is not phase-<N>/<slug>; skipping."
            exit 0
          fi
          n="${BASH_REMATCH[1]}"
          file="docs/PHASES.md"
          if [[ ! -f "$file" ]]; then
            echo "::error file=$file::$file not found"
            exit 1
          fi
          row="$(grep -E "^- \[[ x]\] Phase ${n}( |\$|—|-)" "$file" || true)"
          if [[ -z "$row" ]]; then
            echo "::error file=$file::No 'Phase ${n}' row found in $file. Expected '- [x] Phase ${n} — ...' on a phase-${n}/* branch."
            exit 1
          fi
          if [[ "$row" != "- [x] Phase ${n}"* ]]; then
            echo "::error file=$file::Branch '$HEAD_REF' closes Phase ${n}, but $file still has it unchecked."
            echo "Found: $row"
            echo ""
            echo "Fix: flip the row to '[x]' and append completion date, branch, and any deviations"
            echo "(see the header note in $file). Or rename the branch if this PR does not close Phase ${n}."
            exit 1
          fi
          echo "OK: $row"
