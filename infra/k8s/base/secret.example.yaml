# TEMPLATE ONLY — placeholder values, DO NOT commit a real Secret.
#
# This file documents the keys the `sermon-secrets` Secret MUST carry. The
# REAL Secret is created out-of-band and is NEVER checked in:
#
#   kubectl -n sermon create secret generic sermon-secrets \
#     --from-literal=SERMON_API_JWT_SECRET="$(openssl rand -hex 48)" \
#     --from-literal=SERMON_POSTGRES_USER=... \
#     --from-literal=SERMON_POSTGRES_PASSWORD=... \
#     --from-literal=SERMON_POSTGRES_DB=... \
#     --from-literal=SERMON_REDIS_PASSWORD=... \
#     --from-literal=DEEPINFRA_API_KEY=...
#
# or via sealed-secrets / SOPS (see infra/k8s/README.md §"Secrets"). The
# kustomization deliberately does NOT include this file — it is reference
# documentation, not an applied resource. A real `secret.yaml` is .gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: sermon-secrets
type: Opaque
stringData:
  # REQUIRED. The api lifespan guard REFUSES to boot if this is unset/empty
  # or equals the dev placeholder. Generate: `openssl rand -hex 48`.
  # Without it the api Deployment crash-loops at boot.
  SERMON_API_JWT_SECRET: "REPLACE_ME_openssl_rand_hex_48"

  # Postgres credentials (managed instance or in-cluster StatefulSet).
  SERMON_POSTGRES_USER: "REPLACE_ME"
  SERMON_POSTGRES_PASSWORD: "REPLACE_ME"
  SERMON_POSTGRES_DB: "REPLACE_ME"

  # Redis password — also consumed by the KEDA TriggerAuthentication.
  SERMON_REDIS_PASSWORD: "REPLACE_ME"

  # REQUIRED (ADR 0006 remote inference). Read UNPREFIXED. Every search and
  # ingest 503s/fails without it. Create at deepinfra.com -> API Keys.
  DEEPINFRA_API_KEY: "REPLACE_ME"

  # Only if Milvus's MinIO is self-hosted in-cluster (managed Milvus omits).
  # SERMON_MINIO_ROOT_USER: "REPLACE_ME"
  # SERMON_MINIO_ROOT_PASSWORD: "REPLACE_ME"
