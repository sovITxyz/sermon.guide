[project]
name = "sermon-api"
version = "0.0.0"
description = "sermon.guide FastAPI HTTP layer — auth, upload, task status, search."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.32,<0.40",
  # `pydantic[email]` pulls email-validator, required by `EmailStr` fields
  # in the auth schemas. Without it pydantic raises on model definition.
  "pydantic[email]>=2,<3",
  "python-jose[cryptography]>=3.3,<4",
  # passlib 1.7.4 reads bcrypt's __about__.__version__, which bcrypt 4.1
  # removed; the warning is noisy but harmless. Pinning bcrypt<4.1 keeps
  # the runtime clean until passlib ships a fix.
  "passlib[bcrypt]>=1.7,<2",
  "bcrypt>=4.0,<4.1",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<0.31",
  "pydantic-settings>=2.6,<3",
  "celery>=5.4,<6",
  "redis>=5,<7",
  # Phase 11: search endpoint embeds queries with BGE-Large and runs a
  # filtered Milvus search in-process. Pins must stay aligned with
  # `worker/pyproject.toml` — both processes load the same model from the
  # same HF cache, and drift in pymilvus versions across api/worker would
  # surface as a wire-protocol mismatch only at runtime. The CPU-only
  # torch source override below mirrors worker/ for the same reason
  # (Phase 5 row): the default PyPI wheel ships ~2GB of CUDA libraries
  # we'd never use on api hardware.
  #
  # Phase 13 adds two more models that ride on the same sentence-transformers
  # install (no new pyproject entry needed — both classes are exported by
  # sentence-transformers ≥3): `cross-encoder/ms-marco-MiniLM-L-6-v2`
  # (~90MB, via `sentence_transformers.CrossEncoder`) for top-30 → top-N
  # reranking; `BAAI/bge-m3` (~2.3GB, via `sentence_transformers.SentenceTransformer`)
  # for sentence-level context pruning. Both load lazily per process via
  # `@lru_cache` so import-time / lint / test cost stays free until the
  # first reranked /search.
  "pymilvus>=2.6,<3",
  "sentence-transformers>=3,<6",
  "torch>=2.5,<3",
  "numpy>=2,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pyright",
  "pytest",
  "pytest-asyncio>=0.24,<1",
  "ruff",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "TRY", "ASYNC", "S", "ARG", "ERA", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "use datetime.now(tz=UTC)"
"pickle".msg = "use json or msgpack — pickle is unsafe across versions"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
# api/ is intentionally not packaged (matches worker/ — see `[tool.uv] package
# = false`), so test imports like `from main import …` need cwd on sys.path.
# `../worker` is on the path because api/ imports `db` from there (the only
# cross-package import in the repo; root CLAUDE.md).
pythonpath = [".", "../worker"]
asyncio_mode = "auto"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# `db` and friends live in `../worker`; same rationale as the pytest
# pythonpath above.
extraPaths = ["../worker"]
include = ["main.py", "auth.py", "uploads.py", "search.py", "rerank.py", "highlight.py", "settings.py", "tasks_client.py", "tests"]
venvPath = "."
venv = ".venv"
