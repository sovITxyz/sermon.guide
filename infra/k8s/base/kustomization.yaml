apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All base resources share this label and live in the `sermon` namespace.
namespace: sermon

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: sermon

resources:
  - namespace.yaml
  - configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - worker-deployment.yaml
  - web-deployment.yaml
  - web-service.yaml
  - web-ingress.yaml
  - keda-triggerauthentication.yaml
  - keda-scaledobject.yaml

# DELIBERATELY EXCLUDED from the steady-state apply:
#   - secret.example.yaml : a TEMPLATE — the real Secret is created out-of-band
#                           (kubectl create secret / sealed-secrets / SOPS).
#   - migrate-job.yaml     : one-shot bootstrap Jobs run MANUALLY before the
#                           first rollout, not on every reconcile. See README.
