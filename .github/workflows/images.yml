# Image build/publish — the Phase 29 packaging gate.
#
#   pull_request   BUILD-ONLY. No GHCR login, no push, no secrets. Validates
#                  that each Dockerfile still builds before merge. Fork PRs go
#                  green because nothing here needs `packages: write` or a
#                  login — the push leg is gated on `event_name != pull_request`.
#   push to main   BUILD + PUSH to GHCR. Logs in with the built-in GITHUB_TOKEN
#                  (no PAT), tags each image `latest` + the commit `sha`.
#
# Each image is path-filtered (the `changes` job below) so a docs-only or
# single-package change doesn't rebuild all three. Pushes to main rebuild
# whatever changed; the path filter still applies (a web-only commit on main
# republishes only sermon-web).
#
# Build contexts (see each Dockerfile header):
#   api     repo root  (api/ imports worker.db + worker/convert*) → -f api/Dockerfile .
#   worker  repo root  (carries worker/convert_node + reference.docx)
#   web     web/       (fully independent; own .dockerignore)
#
# GHCR owner MUST be lowercase: the repo owner `sovITxyz` is mixed-case, so the
# image names are hardcoded lowercase (`ghcr.io/sovitxyz/...`) rather than
# derived from ${{ github.repository_owner }}, which GHCR rejects un-lowered.

name: Images

on:
  push:
    branches: [main]
  pull_request:

# Default to read-only. The build jobs raise `packages: write` for themselves,
# and that write scope is only EXERCISED on push to main (the login + push
# steps are `if: github.event_name != 'pull_request'`).
permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the changed-path diff can resolve the PR base.
          fetch-depth: 0
      # Hand-rolled changed-path gate, matching ci.yml's convention (no
      # third-party filter action). Pushes to main always rebuild (the path
      # filter narrows WHICH image). Diff failures fail OPEN — packaging is not
      # a security gate, but "accidentally rebuilt" beats "silently skipped".
      - id: filter
        name: Changed-path gate per image
        shell: bash
        run: |
          set -euo pipefail
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "push event — diffing against the previous commit"
            base="${{ github.event.before }}"
            if [ -z "$base" ] || ! git rev-parse --quiet --verify "$base^{commit}" >/dev/null 2>&1; then
              echo "no usable before-sha — rebuilding all images"
              emit api true; emit worker true; emit web true
              exit 0
            fi
            range="${base}...HEAD"
          else
            range="origin/${GITHUB_BASE_REF}...HEAD"
          fi
          if ! changed="$(git diff --name-only "$range")"; then
            echo "::warning title=Image changed-path gate failed open::git diff for ${range} failed; rebuilding all images."
            emit api true; emit worker true; emit web true
            exit 0
          fi
          echo "Changed files vs ${range}:"
          printf '%s\n' "$changed"
          # api image context = repo root and bundles worker/ — so worker/ and
          # the shared dockerignore changes invalidate it too.
          if printf '%s\n' "$changed" | grep -Eq '^(api/|worker/|\.dockerignore$|\.github/workflows/images\.yml$)'; then
            emit api true
          else
            emit api false
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(worker/|\.dockerignore$|\.github/workflows/images\.yml$)'; then
            emit worker true
          else
            emit worker false
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(web/|\.github/workflows/images\.yml$)'; then
            emit web true
          else
            emit web false
          fi

  api:
    name: api image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      # Login + push only off main. Fork/branch PRs never reach this step, so
      # they need no GHCR credentials and stay green.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sovitxyz/sermon-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  worker:
    name: worker image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sovitxyz/sermon-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  web:
    name: web image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sovitxyz/sermon-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          # web/ is its own context (independent package, own .dockerignore).
          context: web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
