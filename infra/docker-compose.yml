# sermon.guide v0 — local-development infrastructure.
#
# Brought up via `make up` from the repo root. See infra/AGENTS.md for the
# conventions this file follows (env-var naming, healthchecks, schema).
#
# Modern Compose Specification: no top-level `version:` field — that key
# was removed and is silently ignored by docker compose v2.

name: sermon

services:

  postgres:
    image: postgres:16-alpine
    container_name: sermon-postgres
    environment:
      POSTGRES_USER: ${SERMON_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SERMON_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SERMON_POSTGRES_DB}
    ports:
      - "${SERMON_POSTGRES_PORT}:5432"
    volumes:
      - sermon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: sermon-redis
    environment:
      REDIS_PASSWORD: ${SERMON_REDIS_PASSWORD}
    command: >
      redis-server
      --appendonly yes
      --requirepass ${SERMON_REDIS_PASSWORD}
    ports:
      - "${SERMON_REDIS_PORT}:6379"
    volumes:
      - sermon-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  # --- Milvus standalone + its required deps (etcd, MinIO) ---

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: sermon-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - sermon-etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 10s
      retries: 6

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: sermon-minio
    environment:
      MINIO_ROOT_USER: ${SERMON_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SERMON_MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${SERMON_MINIO_PORT}:9000"
      - "${SERMON_MINIO_CONSOLE_PORT}:9001"
    volumes:
      - sermon-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 6

  milvus:
    image: milvusdb/milvus:v2.6.15
    container_name: sermon-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESSKEYID: ${SERMON_MINIO_ROOT_USER}
      MINIO_SECRETACCESSKEY: ${SERMON_MINIO_ROOT_PASSWORD}
    ports:
      - "${SERMON_MILVUS_PORT}:19530"
      - "${SERMON_MILVUS_HEALTH_PORT}:9091"
    volumes:
      - sermon-milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  sermon-postgres:
  sermon-redis:
  sermon-etcd:
  sermon-minio:
  sermon-milvus:
