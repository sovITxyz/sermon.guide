apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: regcred
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/sovitxyz/sermon-web:latest
          imagePullPolicy: IfNotPresent
          # Image default CMD is `node server.js` (Next 15 standalone).
          ports:
            - name: http
              containerPort: 3000
          env:
            # Server-only (lib/config.ts). Internal cluster address — the api
            # is NEVER exposed publicly; browsers hit only the Next handlers.
            - name: API_BASE_URL
              value: "http://api:8000"
            - name: NODE_ENV
              value: "production"
          # Next standalone has no dedicated health route — probe / (mirrors
          # the compose fetch healthcheck). Ingress routes here only once Ready.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
