[project]
name = "sermon-worker"
version = "0.0.0"
description = "sermon.guide ingestion pipeline + Celery workers."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pymilvus>=2.6,<3",
  "python-magic>=0.4.27,<0.5",
  "ebooklib>=0.20,<0.21",
  "pypandoc>=1.17,<2",
  "pymupdf4llm>=1.27,<2",
  "llama-index-core>=0.14,<0.15",
  # Phase 16b (ADR 0006): inference is remote — no model weights load
  # in-process anywhere. The semantic chunker's boundary embedder reaches
  # the same OpenAI-compatible embeddings endpoint `inference.py` uses
  # (same model id, so chunk boundaries stay calibrated); torch +
  # sentence-transformers + the CPU-wheel source override are gone, which
  # drops ~1.5GB from the image and ~3GB of per-ingest RSS spikes.
  "llama-index-embeddings-openai-like>=0.3,<0.4",
  # The `openai` SDK is the embeddings transport (ADR 0006, mirroring the
  # ADR 0005 chat transport in api/); httpx is the thin rerank client —
  # DeepInfra's reranker endpoint is not OpenAI-shaped.
  "openai>=2,<3",
  "httpx>=0.27,<1",
  # numpy moves from dev to runtime: it used to ride in transitively via
  # sentence-transformers, which Phase 16b removed.
  "numpy>=2,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.13,<2",
  "asyncpg>=0.30,<0.32",
  "pydantic-settings>=2.6,<3",
  "datasketch>=1.10.0",
  "nltk>=3.9.4",
  "psycopg[binary]>=3,<4",
  "celery>=5.4,<6",
  "redis>=5,<9",
]

[dependency-groups]
dev = [
  "pyright",
  "pytest",
  "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "TRY", "ASYNC", "S", "ARG", "ERA", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "use datetime.now(tz=UTC)"
"pickle".msg = "use json or msgpack — pickle is unsafe across versions"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
# Worker is intentionally not packaged (see `[tool.uv] package = false`),
# so test imports like `from extractors import …` need cwd on sys.path.
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["extractors", "chunking.py", "db", "embedding.py", "inference.py", "ingest.py", "scripts", "tests", "celery_app.py", "tasks"]
venvPath = "."
venv = ".venv"
