apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
spec:
  # replicas omitted on purpose — KEDA owns this Deployment's replica count
  # (keda-scaledobject.yaml). Setting it here would fight the autoscaler.
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: worker
    spec:
      imagePullSecrets:
        - name: regcred
      # Warm shutdown grace before SIGKILL, matching compose stop_grace_period
      # 120s. A killed mid-ingest task is requeued after the 300s broker
      # visibility timeout (acks_late) and MinHash dedup converges the re-run.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/sovitxyz/sermon-worker:latest
          imagePullPolicy: IfNotPresent
          # Image default CMD is `celery -A celery_app worker --loglevel=info
          # --concurrency=1 --time-limit=3600 --soft-time-limit=3300`. The
          # worker serves no HTTP — no Service routes to it (KEDA + Redis
          # queue depth is its only input).
          envFrom:
            - configMapRef:
                name: sermon-config
            - secretRef:
                name: sermon-secrets
          # No HTTP probe — the worker has no listener. Mirror compose's
          # `celery inspect ping`. Heavy call, so generous timing. No
          # readinessProbe (no Service routes here).
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'celery -A celery_app inspect ping -d celery@$HOSTNAME --timeout 10 | grep -q pong'
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
