[project]
name = "sermon-api"
version = "0.0.0"
description = "sermon.guide FastAPI HTTP layer — auth, upload, task status, search."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.139",
  "uvicorn[standard]>=0.32,<0.50",
  # `pydantic[email]` pulls email-validator, required by `EmailStr` fields
  # in the auth schemas. Without it pydantic raises on model definition.
  "pydantic[email]>=2,<3",
  "python-jose[cryptography]>=3.3,<4",
  # passlib 1.7.4 reads bcrypt's __about__.__version__, which bcrypt 4.1
  # removed; the warning is noisy but harmless. Pinning bcrypt<4.1 keeps
  # the runtime clean until passlib ships a fix.
  "passlib[bcrypt]>=1.7,<2",
  "bcrypt>=4.0,<5.1",
  "python-multipart>=0.0.20,<1",
  # Phase 20: /upload content-sniffs the first bytes via libmagic and 415s
  # non-EPUB/PDF before staging to disk. Pin matches worker/pyproject.toml;
  # needs the libmagic system library (api/Dockerfile installs libmagic1,
  # GitHub's ubuntu runners ship it with `file`).
  "python-magic>=0.4.27,<0.5",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<0.32",
  "pydantic-settings>=2.6,<3",
  "celery>=5.4,<6",
  "redis>=5,<9",
  # Phase 11: search endpoint embeds queries and runs a filtered Milvus
  # search. pymilvus pins must stay aligned with `worker/pyproject.toml` —
  # drift across api/worker would surface as a wire-protocol mismatch only
  # at runtime.
  #
  # Phase 16b (ADR 0006): all three in-process models (BGE-Large query
  # embedding, ms-marco cross-encoder rerank, BGE-M3 highlight) became
  # remote API calls through `worker/inference.py` — sentence-transformers
  # and torch (and the CPU-wheel source override) are gone. httpx is the
  # rerank transport (DeepInfra's reranker endpoint is not OpenAI-shaped);
  # psycopg is the sync driver `worker/embedding.py`'s embedding-space
  # guard reads its Postgres meta row with (same pin as worker/).
  "pymilvus>=2.6,<4",
  "numpy>=2,<3",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3,<4",
  # `worker/inference.py` (imported by api/rerank.py + highlight.py) loads the
  # bundled BGE WordPiece tokenizer to enforce bge-large's 512-token window
  # (ADR 0006 §truncation). Pure-Rust text-splitting, no model weights; pinned
  # in lockstep with worker/.
  "tokenizers>=0.20,<1",
  # Phase 14 (transport re-cut in Phase 14b / ADR 0005): the /search-summary
  # endpoint synthesizes a grounded 1–2 paragraph answer over the reranked +
  # sentence-pruned chunks with Gemini Flash, reached through the `openai`
  # SDK as a config-driven OpenAI-compatible chat-completions transport —
  # Google's compat endpoint (default) or the ppq.ai gateway, selected by
  # SERMON_API_LLM_PROVIDER (summary.py:_PROVIDERS is the provider map; the
  # unprefixed GOOGLE_API_KEY / PPQ_API_KEY env vars thread through explicit
  # aliases in settings.py; infra/.env.example documents all of it). The
  # same SDK also serves worker/inference.py's embeddings leg since Phase
  # 16b — nothing loads in-process anywhere, so no pin-lockstep-with-worker
  # concern applies (but the openai pin itself must satisfy both packages,
  # since api/ imports worker/inference.py).
  "openai>=2,<3",
  # Phase 43: api/ imports `worker.convert` (the 6th sanctioned cross-package
  # import) for the DOCX round-trip — `GET /documents/{id}/export.docx` and
  # `POST /documents/{id}/import`. `worker.convert` imports `pypandoc` at module
  # scope, so the api venv must carry it; pinned in lockstep with
  # `worker/pyproject.toml`. The `pandoc` binary + Node 22 + the
  # `worker/convert_node/` bundle become api+worker image deps for Phase 29 to
  # bake (Dockerfiles untouched this phase; the dev box already has them).
  "pypandoc>=1.17,<2",
  "structlog>=24,<27",
  "prometheus-client>=0.20,<1",
  "sentry-sdk[fastapi]>=2,<3",
]

[dependency-groups]
dev = [
  "pyright",
  "pytest",
  "pytest-asyncio>=0.24,<2",
  "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "TRY", "ASYNC", "S", "ARG", "ERA", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "use datetime.now(tz=UTC)"
"pickle".msg = "use json or msgpack — pickle is unsafe across versions"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
# api/ is intentionally not packaged (matches worker/ — see `[tool.uv] package
# = false`), so test imports like `from main import …` need cwd on sys.path.
# `../worker` is on the path because api/ imports `db` from there (the only
# cross-package import in the repo; root CLAUDE.md).
pythonpath = [".", "../worker"]
asyncio_mode = "auto"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# `db` and friends live in `../worker`; same rationale as the pytest
# pythonpath above.
extraPaths = ["../worker"]
include = ["main.py", "auth.py", "documents.py", "library.py", "reader.py", "uploads.py", "search.py", "summary.py", "rerank.py", "highlight.py", "readyz.py", "ratelimit.py", "metrics.py", "observability.py", "settings.py", "tasks_client.py", "tests"]
venvPath = "."
venv = ".venv"
